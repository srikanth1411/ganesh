<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - Ganesh Chanda</title>
    <link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-decor"></div>
    <main class="container">
        <header class="header"><h1>Staff Login</h1><p>Sign in to manage Laddu collections, spends, and dashboards.</p></header>
        <form id="loginForm" class="glass-form">
            <div class="form-group"><label for="staffName">Staff Name</label><input id="staffName" type="text" autocomplete="username" placeholder="Enter your name" required></div>
            <div class="form-group"><label for="staffPin">PIN</label><input id="staffPin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Enter PIN" required></div>
            <p id="loginMessage" class="form-message" role="status"></p>
            <button id="loginButton" class="submit-btn" type="submit">Login</button>
        </form>
        <div class="footer-msg"><a href="index.html" class="dashboard-link">← Public Chanda Collection</a></div>
    </main>
    <script src="auth.js"></script><script src="login.js"></script>
</body>
</html>
