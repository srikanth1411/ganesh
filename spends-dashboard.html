<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spends Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-decor"></div>
    <nav class="top-nav" aria-label="Main navigation">
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <div class="top-nav-links">
            <a href="staff-dashboard.html">Home</a>
            <a href="chanda.html">Chanda Form</a>
            <a href="spends.html">Spends</a>
            <a href="dashboard.html">Chanda Dashboard</a>
            <a href="laddu-dashboard.html">Laddu Dashboard</a>
            <a href="spends-dashboard.html">Spends Dashboard</a>
            <a href="laddu-auction.html">Laddu Auction</a>
            <a href="laddu-collection.html">Laddu Collection</a>
            <a href="#" id="logoutBtn" class="logout-btn">Logout</a>
        </div>
    </nav>
    <main class="container dashboard-container">
        <header class="header"><h1>Spends Dashboard</h1><p>Track every Ganesh celebration expense.</p></header>
        <section id="spendSummary" class="summary-card" style="display:none;">
            <h2>Total Spends <span id="spendYearLabel"></span></h2>
            <div id="spendTotal" class="total-amount">₹0</div>
        </section>
        <section id="spendFilters" class="filter-section" style="display:none;">
            <input id="spendSearch" type="text" placeholder="Search item or notes...">
            <select id="spendTypeFilter"><option value="All">All Types</option></select>
            <select id="spendYearFilter"><option value="All">All Years</option></select>
        </section>
        <section class="pending-laddu-section">
            <div id="spendLoader" class="loader"></div>
            <div class="spends-table-wrap">
                <table class="spends-table" id="spendTable" style="display:none;">
                    <thead><tr><th>Date</th><th>Type</th><th>Item / Purpose</th><th>Notes</th><th>Bill</th><th>Amount</th></tr></thead>
                    <tbody id="spendRecords"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="auth.js"></script>
    <script src="nav-toggle.js"></script>
    <script src="spends-dashboard.js"></script>
</body>
</html>
