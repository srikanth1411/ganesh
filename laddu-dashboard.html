<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laddu Collection Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-decor"></div>
    <nav class="top-nav" aria-label="Main navigation">
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <div class="top-nav-links">
            <a href="staff-dashboard.html">Home</a>
            <a href="chanda.html">Chanda Form</a>
            <a href="spends.html">Spends</a>
            <a href="dashboard.html">Chanda Dashboard</a>
            <a href="laddu-dashboard.html">Laddu Dashboard</a>
            <a href="spends-dashboard.html">Spends Dashboard</a>
            <a href="laddu-auction.html">Laddu Auction</a>
            <a href="laddu-collection.html">Laddu Collection</a>
            <a href="#" id="logoutBtn" class="logout-btn">Logout</a>
        </div>
    </nav>
    <main class="container dashboard-container">
        <header class="header">
            <h1>Laddu Collection Dashboard</h1>
            <p>Track auction amounts and pending collections.</p>
        </header>
        <section class="summary-card" id="ladduSummary" style="display:none;">
            <h2>Laddu Collection Summary <span id="ladduYearLabel"></span></h2>
            <div class="total-amount" id="ladduPendingTotal">₹0</div>
            <p class="summary-caption">Amount still pending</p>
            <div class="summary-breakdown three-columns">
                <div><span>Auction Value</span><strong id="ladduAuctionTotal">₹0</strong></div>
                <div><span>Collected</span><strong id="ladduCollectedTotal">₹0</strong></div>
                <div><span>Pending Winners</span><strong id="ladduPendingCount">0</strong></div>
            </div>
        </section>
        <section class="filter-section" id="ladduFilters" style="display:none;">
            <input id="ladduSearch" type="text" placeholder="Search by name or mobile...">
            <select id="ladduStatus"><option value="Pending">Pending</option><option value="All">All Records</option><option value="Paid">Fully Paid</option></select>
            <select id="ladduYear"><option value="All">All Years</option></select>
        </section>
        <section class="pending-laddu-section">
            <div id="ladduLoader" class="loader"></div>
            <div id="ladduRecords" class="pending-laddu-list"></div>
        </section>
    </main>
    <script src="auth.js"></script>
    <script src="nav-toggle.js"></script>
    <script src="laddu-dashboard.js"></script>
</body>
</html>
