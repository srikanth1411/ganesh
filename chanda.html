<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganesh Chanda Collection</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-decor"></div>
    <nav class="top-nav" aria-label="Main navigation">
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">⋮</button>
        <div class="top-nav-links">
            <a href="index.html">Home</a>
            <a href="chanda.html">Chanda Form</a>
            <a href="login.html">Staff Login</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="header">
            <h1>Ganesh Chanda 2026</h1>
            <p>Support our local pandal with your generous contribution.</p>
        </div>

        <form id="chandaForm" class="glass-form">
            <div class="form-group">
                <label for="name">Devotee Name</label>
                <input type="text" id="name" name="name" placeholder="Enter full name" required>
            </div>

            <div class="form-group">
                <label for="phone">WhatsApp Number</label>
                <div class="phone-input-wrapper">
                    <span class="country-code">+91</span>
                    <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
                </div>
            </div>

            <div class="form-group">
                <label for="amount">Contribution Amount (₹)</label>
                <input type="number" id="amount" name="amount" placeholder="e.g. 501, 1001" min="1" required>
            </div>

            <div class="form-group">
                <label for="dueDate">Due Date (Optional)</label>
                <input type="date" id="dueDate" name="dueDate">
            </div>

            <button type="submit" class="submit-btn">
                <span>Record & Send WhatsApp</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="whatsapp-icon"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
            </button>
        </form>
        
        <div class="footer-msg">
            <p>Ganapati Bappa Morya! 🙏</p>
            <a href="login.html" class="dashboard-link">Staff Login</a>
        </div>
    </div>

    <script src="nav-toggle.js"></script>
    <script src="script.js"></script>
</body>
</html>
