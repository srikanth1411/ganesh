<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Ganesh Chanda</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-decor"></div>
    <nav class="top-nav" aria-label="Main navigation">
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <div class="top-nav-links">
            <a href="staff-dashboard.html">Home</a>
            <a href="chanda.html">Chanda Form</a>
            <a href="spends.html">Spends</a>
            <a href="spends-dashboard.html">Spends Dashboard</a>
            <a href="dashboard.html">Chanda Dashboard</a>
            <a href="laddu-dashboard.html">Laddu Dashboard</a>
            <a href="laddu-auction.html">Laddu Auction</a>
            <a href="laddu-collection.html">Laddu Collection</a>
            <a href="#" id="logoutBtn" class="logout-btn">Logout</a>
        </div>
    </nav>
    
    <div class="container dashboard-container">
        <div class="header">
            <h1>Collection Dashboard</h1>
            <p>Chanda and Laddu collection records</p>
        </div>

        <div class="summary-card" id="summaryCard" style="display: none;">
            <h2>Total Amount Collected <span id="selectedYearLabel"></span></h2>
            <div class="total-amount" id="totalAmount">₹0</div>
            <div class="summary-breakdown">
                <div><span>Chanda Collected</span><strong id="chandaAmount">₹0</strong></div>
            </div>
        </div>

        <div class="filter-section" id="filterSection" style="display: none;">
            <input type="text" id="searchInput" placeholder="Search by name or mobile...">
            <select id="statusFilter">
                <option value="All">All Statuses</option>
                <option value="Paid">Paid</option>
                <option value="Pending">Pending</option>
            </select>
            <select id="yearFilter" aria-label="Filter by year">
                <option value="All">All Years</option>
            </select>
        </div>

        <div class="table-container">
            <div id="loader" class="loader"></div>
            
            <table id="recordsTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Devotee Name</th>
                        <th>WhatsApp</th>
                        <th>Amount (₹)</th>
                        <th>Due Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data will be populated here by JS -->
                </tbody>
            </table>
        </div>

        
        <div class="footer-msg">
            <a href="index.html" class="dashboard-link">← Back to Form</a>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="nav-toggle.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
